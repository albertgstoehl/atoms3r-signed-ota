[platformio]
default_envs = ota
boards_dir = boards

[env:ota]
platform = espressif32@6.12.0
board = m5stack-atoms3r
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    m5stack/M5Unified@0.2.18
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=3
